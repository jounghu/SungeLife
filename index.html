<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>什么都没有发生</title>
<style>
:root{
  --bg:#0b0b0c;
  --fg:#d9d4cb;
  --muted:#6f6a61;
  --line:#232019;
  --blood:#8a2f2a;
  --tape:#8b8578;

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Noto Serif SC","Songti SC","SimSun",serif;line-height:2;overflow-x:hidden}
button{font:inherit;color:inherit}
#app{max-width:720px;margin:0 auto;padding:16px 20px 32px;min-height:100vh;display:flex;flex-direction:column}
#topbar{display:flex;justify-content:space-between;align-items:center;padding:4px 0 12px;border-bottom:1px solid var(--line);font-family:system-ui,sans-serif}
#chapter{font-size:12px;letter-spacing:.4em;color:var(--muted)}
#soundBtn{background:none;border:1px solid var(--line);color:var(--muted);font-size:12px;padding:4px 14px;border-radius:999px;cursor:pointer;letter-spacing:.2em}
#soundBtn:hover{color:var(--fg);border-color:var(--muted)}
#stage{flex:1;padding:30px 0 8px}
#media{margin:0 auto 26px;text-align:center;min-height:40px}
#text{font-size:17px}
#text p{margin:0 0 16px;font-size:1em;letter-spacing:.07em}
#text p.dim{color:var(--muted);font-size:.9em}
#cue{min-height:16px;font-size:12px;color:var(--muted);letter-spacing:.3em;text-align:center;margin-top:2px;font-family:system-ui,sans-serif;animation:cueBlink 1.3s ease-in-out infinite}
@keyframes cueBlink{0%,100%{opacity:.25}50%{opacity:.9}}
#hint{min-height:22px;font-size:12px;color:var(--muted);font-family:system-ui,sans-serif;letter-spacing:.25em;text-align:center;margin-top:18px}

#hud{border-top:1px solid var(--line);padding-top:10px;font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.choice{background:none;border:0;border-bottom:1px solid var(--line);color:var(--muted);text-align:left;padding:11px 2px;cursor:pointer;font-size:16px;letter-spacing:.08em;display:flex;gap:14px;align-items:baseline}
.choice .c-key{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--blood);flex:none}
.choice:hover,.choice:focus-visible{color:var(--fg);border-color:var(--fg);outline:none}
.btn-main{background:none;border:1px solid var(--muted);color:var(--fg);font-size:16px;letter-spacing:.4em;text-indent:.4em;padding:12px 34px;cursor:pointer;border-radius:2px}
.btn-main:hover{border-color:var(--fg)}
.title-screen{text-align:center;padding-top:5vh}
.title{font-size:32px;font-weight:400;letter-spacing:.5em;text-indent:.5em;margin:20px 0 0;line-height:1.6}
.sub{color:var(--muted);font-size:13px;letter-spacing:.15em;line-height:2.3;margin:22px 0 40px}
.tiny{color:var(--muted);font-size:11px;letter-spacing:.3em;margin-top:60px;font-family:system-ui,sans-serif}
.photo-holder{display:inline-block}
.photo-holder canvas{image-rendering:pixelated;border:1px solid var(--line);background:#050506;display:block;margin:0 auto}
.photo-holder .cap{font-size:11px;color:var(--muted);margin-top:8px;letter-spacing:.25em;font-family:system-ui,sans-serif}
.wave-cap{color:var(--muted);font-size:11px;letter-spacing:.3em;font-family:system-ui,sans-serif;margin-top:8px}
.nail-wrap{max-width:430px;margin:0 auto;user-select:none;touch-action:none}
.nail-head{color:var(--muted);font-size:13px;letter-spacing:.3em;margin-bottom:14px}
.nail-bar{height:58px;border:1px solid var(--line);background:linear-gradient(180deg,#2a2620,#1a1713);border-radius:14px;cursor:ew-resize;display:flex;align-items:center;justify-content:center;color:#8d8578;letter-spacing:.6em;font-size:13px;position:relative;overflow:hidden}
.nail-bar.active{border-color:var(--tape)}
.nail-bar.shake{animation:shake .3s}
.nail-bar .file-pos{position:absolute;top:0;bottom:0;width:3px;background:rgba(217,212,203,.35);left:calc(var(--pos,50%) - 1px);pointer-events:none;transition:left .05s linear}
.passes{display:flex;gap:26px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.pass{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;letter-spacing:.1em}
.pass i{width:9px;height:9px;border-radius:50%;border:1px solid var(--muted);display:inline-block}
.pass.on{color:var(--fg)}
.pass.on i.done{background:var(--blood);border-color:var(--blood)}
.pass.done-p{color:var(--muted)}
.nail-tip,.tape-tip{color:var(--muted);font-size:12px;margin-top:14px;line-height:1.9;font-family:system-ui,sans-serif}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tape-wrap{max-width:430px;margin:0 auto}
.window{margin:0 auto;width:min(340px,78vw);height:230px;background:#050607;border:10px solid #1c1a17;position:relative;border-radius:4px}
.tape-target{position:absolute;opacity:.5;cursor:pointer;border:1px dashed var(--muted)}
.tape-target:hover{opacity:1}
.tape-target[data-t="t"]{top:-9px;left:12%;width:76%;height:12px}
.tape-target[data-t="b"]{bottom:-9px;left:12%;width:76%;height:12px}
.tape-target[data-t="l"]{left:-9px;top:18%;width:12px;height:64%}
.tape-target[data-t="r"]{right:-9px;top:18%;width:12px;height:64%}
.tape-target.dot{width:18px;height:18px;border-radius:50%}
.tape-target[data-t="a"]{top:24px;right:34px}
.tape-target[data-t="p"]{bottom:26px;right:34px}
.tape-target.taped{opacity:1;border-style:solid;background:rgba(139,133,120,.85)}
.tape-target.taped::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(0,0,0,0),rgba(0,0,0,.3))}
.window.afternoon .tape-target.taped{animation:tapeFall 1.6s ease-in forwards}
@keyframes tapeFall{to{transform:translateY(44px) rotate(7deg);opacity:.2}}
.phone-scene{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
#clock{font-family:ui-monospace,Consolas,monospace;font-size:56px;letter-spacing:.2em;color:var(--fg);margin-top:4px;line-height:1.2}
.stats{margin:18px 0 8px;color:var(--muted);font-size:13px;letter-spacing:.12em;line-height:2.4}
.stats .verdict{color:var(--fg);font-size:15px;letter-spacing:.1em}
#grain{position:fixed;inset:-24px;pointer-events:none;z-index:998;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/></svg>");background-size:140px 140px;animation:grainMove .7s steps(5) infinite}
@keyframes grainMove{0%{background-position:0 0}20%{background-position:-28px 14px}40%{background-position:14px -42px}60%{background-position:-42px -14px}80%{background-position:28px 28px}100%{background-position:0 0}}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:999;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.55) 100%)}
#stage{transition:opacity .55s ease}
#fsBtn{margin-left:8px}
#stamp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:1000;opacity:0;transition:opacity .5s ease}
#stamp span{font-size:15px;letter-spacing:.5em;color:var(--muted);text-indent:.5em;font-family:system-ui,sans-serif}
#stamp.show{opacity:1}
.term{max-width:640px;margin:0 auto;background:#040405;border:1px solid var(--line);border-radius:6px;text-align:left;padding:16px 18px;min-height:280px;font-family:ui-monospace,Consolas,monospace;font-size:14px;line-height:1.9;color:#b9c4b0}
.term .tl{white-space:pre-wrap;word-break:break-word}
.term-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.term-row .prompt{color:#8a9a80;flex:none}
#termInput{background:none;border:0;outline:none;color:#d9d4cb;font:inherit;flex:1;caret-color:#b9c4b0;min-width:0}
#termInput::placeholder{color:#3d4638}
.btn-phone{background:none;border:1px solid var(--line);border-radius:6px;padding:12px 18px;cursor:pointer;display:inline-flex;flex-direction:column;gap:6px;align-items:center;color:var(--muted)}
.btn-phone:hover{border-color:var(--tape);color:var(--fg)}
.breath{animation:breath 4s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:.45}50%{opacity:1}}
.report{max-width:420px;margin:0 auto;background:#0d0d0f;border:1px solid var(--line);padding:18px 22px;text-align:left}
.rep-head{font-family:system-ui,sans-serif;font-size:11px;color:var(--muted);letter-spacing:.2em;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
.rep-title{font-size:18px;letter-spacing:.3em;margin-bottom:14px;color:var(--fg)}
.rep-row{font-size:14px;color:var(--muted);margin:8px 0;letter-spacing:.05em}
.rep-next{margin-top:18px;background:none;border:1px solid var(--muted);color:var(--muted);font-size:13px;padding:6px 22px;cursor:pointer;letter-spacing:.3em}
.rep-next:hover{color:var(--fg);border-color:var(--fg)}
:fullscreen #app{height:100vh;max-height:100vh;overflow:hidden;padding-top:6px}
:fullscreen #topbar{flex:none}
:fullscreen #stage{flex:1;overflow-y:auto;scrollbar-width:none;padding-top:10px}
:fullscreen #stage::-webkit-scrollbar{display:none}
:fullscreen #media{display:flex;flex-direction:column;align-items:center;justify-content:center}
:fullscreen #photoCanvas{width:auto;height:18vh}
:fullscreen #sea{width:auto;height:15vh}
:fullscreen .term{max-height:36vh;overflow-y:auto;scrollbar-width:none}
:fullscreen .term::-webkit-scrollbar{display:none}
:fullscreen .title-screen{padding-top:2vh}
:fullscreen .btn-phone svg{width:34px;height:51px}
:fullscreen .report{max-height:32vh;overflow-y:auto;scrollbar-width:none}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
@media (max-width:520px){
  .title{font-size:26px}
  #text{font-size:16px}
}
</style>
</head>
<body>
<div id="grain" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>
<div id="stamp" aria-hidden="true"><span></span></div>
<div id="app">
  <header id="topbar">
    <div id="chapter">引子</div>
    <div>
      <button id="soundBtn" type="button">声 开</button>
      <button id="fsBtn" type="button">全屏</button>
    </div>
  </header>
  <main id="stage">
    <div id="media"></div>
    <div id="text" aria-live="polite"></div>
    <div id="cue"></div>
    <div id="hint"></div>
    <div id="choices"></div>
  </main>
  <footer id="hud"><span id="hudL">钱 0 · 沉默 0 · 相信 0 · 说不 0</span><span id="hudR"></span></footer>
</div>
<script>
'use strict';
/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= 声音（全部现场合成，零文件） ================= */
const AudioSys = {
  ctx:null, master:null, muted:false, _noise:null,
  nodes:{},
  ensure(){
    if(!this.ctx){
      try{
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.9;
        this.master.connect(this.ctx.destination);
      }catch(e){}
    }
    if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  setMuted(m){
    this.muted = m;
    if(this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.05);
  },
  noiseBuf(){
    if(this._noise) return this._noise;
    const ctx = this.ctx, len = ctx.sampleRate * 2;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for(let i=0;i<len;i++){
      const w = Math.random()*2 - 1;
      last = (last + 0.02*w) / 1.02;
      d[i] = last * 3.5;
    }
    this._noise = buf;
    return buf;
  },
  tone(freq, dur, delay, type, vol){
    if(!this.ctx) return;
    const t = this.ctx.currentTime + (delay||0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type||'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol||0.1, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },
  noise({dur, vol, ftype, ffreq}){
    if(!this.ctx) return;
    const t = this.ctx.currentTime;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf(); src.loop = true;
    const f = this.ctx.createBiquadFilter();
    f.type = ftype||'bandpass'; f.frequency.value = ffreq||2000; f.Q.value = 1;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol||0.15, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur||0.1));
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + (dur||0.1) + 0.05);
  },
  blip(f){ this.tone(f||660, 0.09, 0, 'triangle', 0.08); },
  chime(){
    this.tone(660, 0.16, 0, 'triangle', 0.09);
    this.tone(880, 0.16, 0.13, 'triangle', 0.09);
    this.tone(1320, 0.34, 0.26, 'triangle', 0.09);
  },
  scratch(){
    if(!this.ctx) return;
    for(let i=0;i<4;i++) this.noise({dur:0.045, vol:0.12, ftype:'bandpass', ffreq:2600});
  },
  tape(){ this.noise({dur:0.09, vol:0.18, ftype:'highpass', ffreq:1600}); },
  key(){ this.tone(1500, 0.014, 0, 'square', 0.012); },
  bad(){
    if(!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(90, t + 0.25);
    g.gain.setValueAtTime(0.09, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.3);
  },
  fadeStop(node, key){
    if(!node) return;
    const ctx = this.ctx, g = node.gain;
    try{
      g.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.3);
    }catch(e){}
    setTimeout(()=>{
      try{ node.source && node.source.stop(); }catch(e){}
      try{ node.oscs && node.oscs.forEach(o=>o.stop()); }catch(e){}
      if(key) delete this.nodes[key];
    }, 800);
  },
  ambient({drone, ocean, heart}){
    const ctx = this.ctx; if(!ctx) return;
    if(drone && !this.nodes.drone){
      const g = ctx.createGain(); g.gain.value = 0;
      const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
      o1.type = 'sine'; o1.frequency.value = 55;
      o2.type = 'sine'; o2.frequency.value = 82.41;
      const o3 = ctx.createOscillator(); o3.type = 'sine'; o3.frequency.value = 55.8;
      [o1,o2,o3].forEach(o=>{ o.connect(g); o.start(); });
      g.connect(this.master);
      g.gain.setTargetAtTime(0.028, ctx.currentTime, 1.2);
      this.nodes.drone = {gain:g, oscs:[o1,o2,o3]};
    }else if(!drone && this.nodes.drone){
      this.fadeStop(this.nodes.drone, 'drone');
    }
    if(ocean && !this.nodes.ocean){
      const src = ctx.createBufferSource(); src.buffer = this.noiseBuf(); src.loop = true;
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
      const g = ctx.createGain(); g.gain.value = 0;
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = 0.06; lg.gain.value = 90;
      lfo.connect(lg); lg.connect(f.frequency); lfo.start();
      src.connect(f); f.connect(g); g.connect(this.master);
      g.gain.setTargetAtTime(0.05, ctx.currentTime, 1.5);
      src.start();
      this.nodes.ocean = {gain:g, source:src, lfo:lfo};
    }else if(!ocean && this.nodes.ocean){
      this.fadeStop(this.nodes.ocean, 'ocean');
    }
    if(heart && !this.nodes.heart){
      const timer = setInterval(()=>{
        if(!this.ctx) return;
        const beat = (dt)=>{
          const t = this.ctx.currentTime + dt;
          const o = this.ctx.createOscillator(), g = this.ctx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(62, t);
          o.frequency.exponentialRampToValueAtTime(38, t + 0.16);
          g.gain.setValueAtTime(0.38, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
          o.connect(g); g.connect(this.master);
          o.start(t); o.stop(t + 0.3);
        };
        beat(0); beat(0.28);
      }, 980);
      this.nodes.heart = {timer};
    }else if(!heart && this.nodes.heart){
      clearInterval(this.nodes.heart.timer);
      delete this.nodes.heart;
    }
  },
  ring(on){
    if(!this.ctx) return;
    if(on && !this.nodes.ring){
      const g = this.ctx.createGain(); g.gain.value = 0;
      const o1 = this.ctx.createOscillator(), o2 = this.ctx.createOscillator();
      o1.type = 'sine'; o1.frequency.value = 440;
      o2.type = 'sine'; o2.frequency.value = 480;
      o1.connect(g); o2.connect(g); g.connect(this.master);
      o1.start(); o2.start();
      const timer = setInterval(()=>{
        if(!this.ctx){ return; }
        const onNow = Math.floor(performance.now()/2000) % 2 === 0;
        g.gain.setTargetAtTime(onNow ? 0.05 : 0.0001, this.ctx.currentTime, 0.08);
      }, 500);
      this.nodes.ring = {gain:g, oscs:[o1,o2], timer};
    }else if(!on && this.nodes.ring){
      clearInterval(this.nodes.ring.timer);
      this.fadeStop(this.nodes.ring, 'ring');
    }
  }
};

/* ================= 状态 ================= */
const S = { money:0, silence:0, trust:0, no:0, photo:false, degrade:0, gave8:false, spoke:false };
function fx(e){
  if(!e) return;
  if(e.money) S.money += e.money;
  if(e.silence) S.silence += e.silence;
  if(e.trust) S.trust += e.trust;
  if(e.no) S.no += e.no;
  if(e.photo) S.photo = true;
  if(e.gave8) S.gave8 = true;
  if(e.spoke) S.spoke = true;
  updateHUD();
}
function updateHUD(){
  $('#hudL').textContent = `钱 ${S.money} · 沉默 ${S.silence} · 相信 ${S.trust} · 说不 ${S.no}`;
}
function setChapter(t){ $('#chapter').textContent = t; }

/* ================= 像素照片（代码生成，越到后面越糊） ================= */
function drawPhotoOn(cv, res){
  const W = 120, H = 150;
  const rand = mulberry32(2007 + res * 13);
  const off = document.createElement('canvas');
  off.width = res; off.height = Math.max(3, Math.round(res * H / W));
  const octx = off.getContext('2d');
  const iw = off.width, ih = off.height;
  const cx = iw/2, cy = ih*0.42, rx = iw*0.34, ry = ih*0.30;
  const img = octx.createImageData(iw, ih);
  for(let y=0;y<ih;y++){
    for(let x=0;x<iw;x++){
      const nx = (x-cx)/rx, ny = (y-cy)/ry;
      const inFace = nx*nx + ny*ny <= 1;
      let v;
      if(inFace){
        v = 90 + rand()*80;
        if(ny > 0.6 && Math.abs(nx) < 0.22) v -= 35;
        if(Math.abs(ny + 0.08) < 0.13 && Math.abs(nx - 0.3) < 0.14) v = 22;
        if(Math.abs(ny + 0.08) < 0.13 && Math.abs(nx + 0.3) < 0.14) v = 22;
      }else if(y > ih*0.7){
        v = 24 + rand()*22;
      }else{
        v = 9 + rand()*16;
      }
      const k = (y*iw + x)*4;
      img.data[k] = v; img.data[k+1] = v; img.data[k+2] = v*0.95; img.data[k+3] = 255;
    }
  }
  octx.putImageData(img, 0, 0);
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#050506'; ctx.fillRect(0,0,W,H);
  ctx.drawImage(off, 0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  for(let y=0;y<H;y+=3) ctx.fillRect(0, y, W, 1);
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for(let y=0;y<H;y+=7) ctx.fillRect(0, y, W, 1);
}

  drawPhotoOn($('#photoCanvas'), res);

/* ================= 海（动画 Canvas） ================= */
let seaRAF = null;
function startSea(){
  $('#media').innerHTML = `<canvas id="sea" width="640" height="230"></canvas><div class="wave-cap">太 平 洋</div>`;
  const cv = $('#sea');
  const ctx = cv.getContext('2d');
  const draw = (time)=>{
    const w = cv.width, h = cv.height;
    const grad = ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,'#0c1116');
    grad.addColorStop(0.55,'#0f1a21');
    grad.addColorStop(1,'#0a0a0b');
    ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
    const horizon = h*0.42;
    ctx.strokeStyle = 'rgba(150,160,170,0.32)';
    ctx.beginPath(); ctx.moveTo(0,horizon); ctx.lineTo(w,horizon); ctx.stroke();
    for(let i=0;i<3;i++){
      ctx.strokeStyle = `rgba(140,155,165,${0.15 - i*0.03})`;
      ctx.beginPath();
      const yy = horizon + 16 + i*22;
      for(let x=0;x<=w;x+=4){
        const y = yy + Math.sin(x*0.012 + i*1.7 + time*0.0004 + i)*(2+i) + Math.sin(x*0.045 + time*0.001)*1.5;
        if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    if(!REDUCED) seaRAF = requestAnimationFrame(draw);
  };
  draw(performance.now());
}
function stopSea(){ if(seaRAF){ cancelAnimationFrame(seaRAF); seaRAF = null; } }

/* ================= 打字机 ================= */
let fast = false;
let typing = null;
function showCue(label){
  const cue = $('#cue');
  if(cue) cue.textContent = label;
}
function hideCue(){
  const cue = $('#cue');
  if(cue) cue.textContent = '';
}
async function say(lines, opts){
  opts = opts || {};
  typing = {lines, i:0, waiting:false, opts};
  const box = $('#text');
  box.innerHTML = '';
  $('#choices').innerHTML = '';
  $('#hint').textContent = opts.hint || '';
  await startLine();
}
async function startLine(){
  const t = typing;
  if(!t || t.i >= t.lines.length){ finishSay(); return; }
  const line = t.lines[t.i];
  const p = document.createElement('p');
  if(line.startsWith('.')) p.classList.add('dim');
  const text = line.replace(/^\./, '');
  $('#text').appendChild(p);
  t.p = p; t.text = text; t.fastLine = false; t.waiting = false;
  const sp = REDUCED ? 0 : (t.opts.speed == null ? 26 : t.opts.speed);
  for(let i=0;i<text.length;i++){
    if(t.fastLine){ p.textContent = text; break; }
    p.textContent = text.slice(0, i+1);
    await sleep(sp);
  }
  if(!typing || typing !== t) return;
  t.waiting = true;
  showCue(t.i < t.lines.length - 1 ? '▼ 点击继续' : '▼ 继续');
  fitText();
}
function advance(){
  const t = typing;
  if(!t) return;
  if(!t.waiting){
    t.fastLine = true;
    return;
  }
  if(t.i < t.lines.length - 1){
    t.i++;
    hideCue();
    startLine();
  }else{
    finishSay();
  }
}
function finishSay(){
  if(!typing) return;
  const opts = typing.opts;
  typing = null;
  hideCue();
  if(opts.after) opts.after();
  fitText();
}
function showChoices(list){
  const box = $('#choices');
  box.innerHTML = '';
  list.forEach((c,i)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'choice';
    b.innerHTML = `<span class="c-key">${i+1}</span><span>${c.t}</span>`;
    b.addEventListener('click', ()=>choose(c));
    box.appendChild(b);
  });
  fitText();
}
function choose(c){
  AudioSys.blip(660);
  $('#hint').textContent = '';
  if(c.fx) fx(c.fx);
  if(c.goto){
    $('#choices').innerHTML = '';
    hideCue();
    go(c.goto);
  }
}

/* ================= 磨指甲 ================= */
let nailState = null;
let nailCleanup = null;
function renderPasses(){
  const box = $('#passes'); if(!box) return;
  const names = ['粗面','光面','收尾'];
  box.innerHTML = '';
  for(let p=0;p<3;p++){
    const d = document.createElement('div');
    d.className = 'pass' + (p===nailState.pass ? ' on' : '') + (p<nailState.pass ? ' done-p' : '');
    let dots = '';
    for(let s=0;s<3;s++){
      dots += `<i class="${s < (p===nailState.pass ? nailState.strokes : (p<nailState.pass ? 3 : 0)) ? 'done' : ''}"></i>`;
    }
    d.innerHTML = `<span>${names[p]}</span>${dots}`;
    box.appendChild(d);
  }
}
function nailStroke(){
  if(nailState.done) return;
  AudioSys.scratch();
  nailState.strokes++;
  if(nailState.strokes >= 3){
    if(nailState.pass < 2){ nailState.pass++; nailState.strokes = 0; }
    else { nailState.strokes = 3; }
  }
  renderPasses();
  if(nailState.pass === 2 && nailState.strokes === 3) completeNail();
}
function nailFail(){
  AudioSys.bad();
  nailState.strokes = 0;
  renderPasses();
  const bar = $('#nailBar');
  if(bar){
    bar.classList.remove('shake');
    void bar.offsetWidth;
    bar.classList.add('shake');
  }
  $('#hint').textContent = '要顺着一个方向。';
}
function completeNail(){
  nailState.done = true;
  if(nailCleanup){ nailCleanup(); nailCleanup = null; }
  AudioSys.chime();
  $('#hint').textContent = '';
  say([
    '十个手指，她花了快一个小时。',
    '她说，这一面磨形状，这一面抛光，最后一面不要来回蹭，要顺着一个方向。',
    '磨完她把我的手翻过来看了看，摸了一下。',
    '她说，行了。摸吧，想摸哪都行。',
    '.中间她说过一句话：要是以后我不在了，就再没有人给你抛指甲了。'
  ],{after:()=>{ fx({trust:1}); go('report'); }});
}
function nailMini(){
  nailState = {pass:0, strokes:0, done:false};
  $('#media').innerHTML = `
    <div class="nail-wrap">
      <div class="nail-head">磨到不刮人为止</div>
      <div class="nail-bar" id="nailBar"><span>指甲</span><span class="file-pos"></span></div>
      <div class="passes" id="passes"></div>
      <div class="nail-tip">用鼠标或手指，从左往右，一下一下地磨。收尾那一面，千万不要来回蹭。</div>
    </div>`;
  renderPasses();
  const bar = $('#nailBar');
  let active = false, lastX = 0;
  const posEl = $('.file-pos');
  const onDown = e=>{
    active = true;
    lastX = e.clientX;
    bar.classList.add('active');
    posEl.style.setProperty('--pos', '0%');
  };
  const onMove = e=>{
    if(!active || nailState.done) return;
    const dx = e.clientX - lastX;
    if(dx > 42){ nailStroke(); lastX = e.clientX; }
    else if(dx < -30){ nailFail(); lastX = e.clientX; }
  };
  const onUp = ()=>{ active = false; bar.classList.remove('active'); };
  const onKey = e=>{
    if(e.code === 'Space' && !e.repeat){
      e.preventDefault();
      nailStroke();
    }
  };
  bar.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  document.addEventListener('keydown', onKey);
  nailCleanup = ()=>{
    bar.removeEventListener('pointerdown', onDown);
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    document.removeEventListener('keydown', onKey);
  };
}

/* ================= Claude Code 终端 ================= */
let termState = null;
async function termType(text){
  const box = $('#termLines');
  if(!box) return;
  const div = document.createElement('div');
  div.className = 'tl';
  box.appendChild(div);
  const sp = REDUCED ? 0 : 9;
  for(let i=0;i<text.length;i++){
    if(fast){ div.textContent = text; break; }
    div.textContent = text.slice(0, i+1);
    await sleep(sp);
  }
  div.scrollIntoView({block:'nearest'});
}
async function termRun(lines){
  for(const l of lines){
    if(typeof l === 'string') await termType(l);
    else await sleep(l);
  }
}
function termEcho(text){
  const box = $('#termLines');
  if(!box) return;
  const div = document.createElement('div');
  div.className = 'tl';
  div.textContent = '❯ ' + text;
  box.appendChild(div);
  div.scrollIntoView({block:'nearest'});
}
function setTermPlaceholder(p){
  const input = $('#termInput');
  if(!input) return;
  input.placeholder = p;
  input.focus();
}
async function runTermCommand(text){
  const input = $('#termInput');
  if(!input) return;
  const step = termState.step;
  termState.step++;
  termEcho(text);
  if(step === 0){
    await termRun([
      '✻ Welcome to Claude Code',
      '> 已连接工作区 · ~/assets',
      '> 可用命令：/help'
    ]);
    setTermPlaceholder('分析所有现金资产，评估转出五千万美元的影响');
  }else if(step === 1){
    await termRun([
      '> 读取账户清单… 完成（47 个账户）',
      '> 汇总流动性资产… 完成',
      '> 核对交叉持有… 完成',
      '> 评估资金转出影响…',
      '',
      '结论：转出 5,000 万美元不会对您的资产结构产生任何影响。',
      '我又核了一遍。结果一致。'
    ]);
    setTermPlaceholder('我应该把这五千万美元给她吗？');
  }else if(step === 2){
    await termRun([
      '不要把这五千万美元给她。'
    ]);
    setTermPlaceholder('她不再爱我了吗？');
  }else if(step === 3){
    await termRun([
      '对于爱情，我不关心，也不理解。',
      '但是你不能把这五千万美元给她。'
    ]);
    AudioSys.ambient({drone:true, ocean:false, heart:true});
    const row = $('#termRow');
    if(row) row.style.display = 'none';
    $('#hint').textContent = '';
    await termRun([
      '',
      '我盯着那行字看了很久。',
      '让我毛骨悚然的不是它聪明，是它一点犹豫都没有。',
      '它不为难。'
    ]);
    say([
      '我当时想，这大概是更高的一种东西。人做不到这样。',
      '她不再爱我了吗。'
    ],{after:()=>go('day9')});
  }
}
function showTerminal(){
  setChapter('第三幕 · Claude Code');
  termState = {step:0, done:false};
  $('#media').innerHTML = `
    <div class="term" id="term">
      <div id="termLines"></div>
      <div class="term-row" id="termRow">
        <span class="prompt">❯</span>
        <input id="termInput" type="text" spellcheck="false" autocomplete="off" placeholder="claude">
      </div>
    </div>`;
  $('#hint').textContent = '键入指令，然后按 Enter';
  const input = $('#termInput');
  input.focus();
  input.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){
      e.preventDefault();
      e.stopPropagation();
      const text = input.value.trim() || input.placeholder;
      input.value = '';
      runTermCommand(text);
    }else if(e.key.length === 1){
      AudioSys.key();
    }
  });
}

/* ================= 结局 ================= */
function finish(verdict){
  $('#media').innerHTML = '';
  $('#hint').textContent = '';
  const el = document.createElement('div');
  el.className = 'stats';
  el.innerHTML = `
    <div class="stat-line">钱 ${S.money}　·　沉默 ${S.silence}　·　相信 ${S.trust}　·　说不 ${S.no}</div>
    <div class="verdict">${verdict}</div>`;
  $('#text').appendChild(el);
  const again = document.createElement('button');
  again.type = 'button';
  again.className = 'btn-main';
  again.textContent = '从头再来';
  again.addEventListener('click', ()=>reset());
  $('#choices').appendChild(again);
}

function showStamp(text, done){
  const st = $('#stamp');
  if(REDUCED || !text){ done(); return; }
  st.querySelector('span').textContent = text;
  st.classList.add('show');
  setTimeout(()=>{
    st.classList.remove('show');
    setTimeout(done, 500);
  }, 700);
}
function fitText(){
  const stage = $('#stage');
  const el = $('#text');
  if(!stage || !el) return;
  if(!document.fullscreenElement){
    el.style.fontSize = '';
    return;
  }
  let size = 17;
  el.style.fontSize = size + 'px';
  while(size > 13 && stage.scrollHeight > stage.clientHeight + 2){
    size -= 0.5;
    el.style.fontSize = size + 'px';
  }
}
function setAmbient(id){
  const a = {drone:false, ocean:false, heart:false};
  if(['title','pro','pro2','pro3','pro4','pro5','meet','meet2','meet3','nail','report','hk4','day8hangup','term','e1','e2','e3','e4','aftermath'].includes(id)) a.drone = true;
  if(['opening','opening2','opening3','m1','m2','m3','m4','m5','m6','m7','m8','m9','m10','m11','m12','m13','m14','m15','hk1','hk2','hk3','hk5','hk6','call','day9'].includes(id)){ a.ocean = true; a.drone = true; }
  if(['e1','e3','aftermath'].includes(id)) a.heart = true;
  AudioSys.ambient(a);
}
function go(id){
  stopSea();
  if(countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
  if(nailCleanup){ nailCleanup(); nailCleanup = null; }
  $('#hint').textContent = '';
  $('#hint').classList.remove('breath');
  setAmbient(id);
  const stage = $('#stage');
  stage.style.opacity = 0;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ stage.style.opacity = 1; }));
  const map = {
    title:showTitle, opening:showOpening, opening2:showOpening2, opening3:showOpening3,
    pro:showPro, pro2:showPro2, pro3:showPro3, pro4:showPro4, pro5:showPro5,
    meet:showMeet, meet2:showMeet2, meet3:showMeet3, nail:showNail, report:showReport,
    m1:showM1, m2:showM2, m3:showM3, m4:showM4, m5:showM5, m6:showM6, m7:showM7,
    m8:showM8, m9:showM9, m10:showM10, m11:showM11, m12:showM12, m13:showM13, m14:showM14, m15:showM15,
    hk1:showHK1, hk2:showHK2, hk3:showHK3, hk4:showHK4, hk5:showHK5, hk6:showHK6,
    call:showCall, day8hangup:showDay8Hangup, term:showTerminal, day9:showDay9, aftermath:showAftermath,
    e1:showE1, e2:showE2, e3:showE3, e4:showE4
  };
  if(map[id]){
    const st = STAMPS[id];
    if(st) showStamp(st, map[id]);
    else map[id]();
  }
  window.scrollTo({top:0});
  fitText();
}
function reset(){
  Object.assign(S, {money:0, silence:0, trust:0, no:0, photo:false, degrade:0, gave8:false, spoke:false});
  stopSea();
  if(countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
  if(nailCleanup){ nailCleanup(); nailCleanup = null; }
  AudioSys.ring(false);
  updateHUD();
  go('title');

/* ================= 输入 ================= */
document.addEventListener('keydown', e=>{
  const tag = e.target && e.target.tagName;
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  if(e.key === 'Enter'){
    if(typing) advance();
    else{
      const first = $('.choice');
      if(first) first.click();
    }
  }else if(/^[1-9]$/.test(e.key)){
    const ch = $(`#choices .choice:nth-child(${e.key})`);
    if(ch) ch.click();
  }
});
$('#stage').addEventListener('pointerdown', e=>{
  if(e.target.closest('button')) return;
  advance();
});
$('#soundBtn').addEventListener('click', ()=>{
  AudioSys.ensure();
  AudioSys.setMuted(!AudioSys.muted);
  $('#soundBtn').textContent = AudioSys.muted ? '声 关' : '声 开';
});
$('#fsBtn').addEventListener('click', ()=>{
  if(document.fullscreenElement){
    document.exitFullscreen();
  }else if(document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen();
  }
});
document.addEventListener('fullscreenchange', ()=>{
  $('#fsBtn').textContent = document.fullscreenElement ? '退出全屏' : '全屏';
  fitText();
});
let fitTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(fitTimer);
  fitTimer = setTimeout(fitText, 150);
});

/* ================= 测试钩子 ================= */
window.__G = {
  state:S,
  fast:()=>{ fast = true; },
  advanceAll: async ()=>{
    const deadline = Date.now() + 15000;
    while(Date.now() < deadline && typing){
      advance();
      await new Promise(r=>setTimeout(r, 2));
    }
  },
  autoNail:()=>{ if(nailState && !nailState.done){ for(let i=0;i<9;i++) nailStroke(); } },
  autoTape:()=>{ $$('.tape-target').forEach(el=>{ if(!el.classList.contains('taped')) tapTape(el); }); },
  termEnter:()=>{
    const i = $('#termInput');
    if(i) i.dispatchEvent(new KeyboardEvent('keydown', {key:'Enter', bubbles:true, cancelable:true}));
  },
  answerPhone:()=>{
    const b = $('#phoneBtn');
    if(b) b.click();
  }
};
